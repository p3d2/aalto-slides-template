<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#000000">Build time per deck (ms, lower is better)</text>
  <!-- axes -->
  <line x1="60" y1="340" x2="600" y2="340" stroke="#000000" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="340" stroke="#000000" stroke-width="2"/>
  <!-- bars: PowerPoint 9000, Slidev 2500, Typst 50 (log-ish, illustrative) -->
  <rect x="110" y="100" width="110" height="240" fill="#FD6360"/>
  <rect x="270" y="220" width="110" height="120" fill="#F7E159"/>
  <rect x="430" y="332" width="110" height="8" fill="#46A5FF"/>
  <text x="165" y="368" font-size="20" fill="#595959" text-anchor="middle">PowerPoint</text>
  <text x="325" y="368" font-size="20" fill="#595959" text-anchor="middle">Slidev</text>
  <text x="485" y="368" font-size="20" fill="#595959" text-anchor="middle">Typst</text>
  <text x="165" y="92" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">~9000</text>
  <text x="325" y="212" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">~2500</text>
  <text x="485" y="324" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">~50</text>
</svg>
